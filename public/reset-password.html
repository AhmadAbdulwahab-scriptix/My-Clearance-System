<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password - Student Clearance</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <!-- Opened from the link in the reset email: reset-password.html?token=... -->
  <body class="auth-page">
    <div class="auth-card">
      <h1>Choose a new password</h1>
      <p class="muted">Student Clearance, Bayero University Kano</p>

      <!-- The form -->
      <form id="reset-form">
        <label>
          New password (at least 6 characters)
          <input name="password" type="password" minlength="6" required autocomplete="new-password">
        </label>

        <label>
          Confirm new password
          <input name="confirm" type="password" minlength="6" required autocomplete="new-password">
        </label>

        <button class="btn">Change password</button>
        <a class="link-button" href="index.html">Back to sign in</a>
      </form>

      <!-- Shown after the password was changed -->
      <div id="reset-done" hidden>
        <div class="notice">Your password has been changed. You can now sign in with it.</div>
        <a class="btn" href="index.html">Go to sign in</a>
      </div>

      <!-- Shown when the link has no token in it -->
      <div id="reset-invalid" hidden>
        <div class="notice error">This reset link is not valid. Please request a new one from the sign-in page.</div>
        <a class="btn" href="index.html">Back to sign in</a>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/reset-password.js"></script>
  </body>
</html>
