<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Office queue</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main class="container">

      <!-- Tab 1: items waiting for this officer -->
      <section id="tab-queue">
        <div class="card">
          <div class="row">
            <h2>Waiting for your review</h2>
            <input id="queue-search" style="max-width: 260px" placeholder="Search name or reg. no.">
          </div>
          <div class="table-wrap" id="queue-list"></div>
        </div>
      </section>

      <!-- Tab 2: items this officer already decided -->
      <section id="tab-history" hidden>
        <div class="card">
          <div class="row">
            <h2>Reviewed items</h2>
            <div class="row">
              <select id="history-status" style="width: auto">
                <option value="">All decisions</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
              </select>
              <input id="history-search" placeholder="Search name or reg. no.">
            </div>
          </div>
          <div class="table-wrap" id="history-list"></div>
        </div>
      </section>

      <!-- Tab 3: numbers -->
      <section id="tab-stats" hidden>
        <div class="stats" id="stats-list"></div>
      </section>

    </main>

    <!-- Document Viewer Modal -->
    <div id="document-viewer-modal" class="modal" hidden>
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Resubmission Documents</h2>
          <button class="modal-close" id="document-viewer-close">&times;</button>
        </div>

        <div class="modal-body">
          <!-- Document info -->
          <div class="document-info">
            <div class="info-row">
              <span class="label">Student note:</span>
              <span class="value" id="viewer-note">—</span>
            </div>
            <div class="info-row">
              <span class="label">Documents uploaded:</span>
              <span class="value" id="viewer-count">0</span>
            </div>
            <div class="info-row">
              <span class="label">Uploaded at:</span>
              <span class="value" id="viewer-date">—</span>
            </div>
          </div>

          <!-- Document list -->
          <div class="document-list" id="document-list"></div>

          <!-- Close button -->
          <div class="form-actions">
            <button type="button" class="btn btn-outline" id="document-viewer-done">
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/document-viewer.js"></script>
    <script src="js/personnel.js"></script>
  </body>
</html>
