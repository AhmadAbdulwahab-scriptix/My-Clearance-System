<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My clearance</title>
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <main class="container">

      <!-- Tab 1: the student's clearance request -->
      <section id="tab-request">
        <div id="current-request"></div>
        <div id="certificate"></div>
        <div id="earlier-requests"></div>
      </section>

      <!-- Tab 2: chatbot -->
      <section id="tab-assistant" hidden>
        <div class="card">
          <div class="row">
            <h3>Clearance assistant</h3>
            <button class="btn btn-danger btn-small" id="clear-chat">Clear chat</button>
          </div>
          <p class="muted">Ask about your status, why an office rejected you, or what to do next.</p>

          <div class="chat-box" id="chat-box"></div>

          <form class="chat-form" id="chat-form">
            <input id="question" placeholder="Type your question" required>
            <button class="btn">Ask</button>
          </form>
        </div>
      </section>

    </main>

    <!-- Resubmission Modal -->
    <div id="resubmit-modal" class="modal" hidden>
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Resubmit Your Clearance Item</h2>
          <button class="modal-close" id="resubmit-close">&times;</button>
        </div>

        <div class="modal-body">
          <!-- Item info section -->
          <div class="resubmit-info">
            <div class="info-row">
              <span class="label">Office:</span>
              <span class="value" id="resubmit-office">—</span>
            </div>
            <div class="info-row">
              <span class="label">Rejection reason:</span>
              <span class="value" id="resubmit-reason">—</span>
            </div>
            <div class="info-row">
              <span class="label">Category:</span>
              <span class="value category-badge" id="resubmit-category">—</span>
            </div>
          </div>

          <!-- Resubmission form -->
          <form id="resubmit-form">
            <!-- File upload section (FIRST) -->
            <div class="form-group" id="documents-section">
              <label>
                <span class="label-icon">📎</span>
                <span id="docs-label">Upload Documents</span>
                <span class="docs-requirement" id="docs-requirement">(Optional)</span>
              </label>

              <!-- Add document button -->
              <button
                type="button"
                class="btn btn-outline btn-small"
                id="add-document-btn"
                style="margin-bottom: 12px; width: 100%"
              >
                + Add Document
              </button>

              <!-- Documents list (dynamically added) -->
              <div class="documents-list" id="documents-list"></div>

              <!-- Info text -->
              <small class="hint-text" id="docs-hint">
                Add files one by one. You can add up to 5 documents total.
              </small>
            </div>

            <!-- Contextual note section (AFTER documents) -->
            <div class="form-group">
              <label for="resubmit-note">
                <span class="label-icon" id="resubmit-icon">✏️</span>
                <span id="resubmit-label">Tell us what you did to fix this</span>
              </label>
              <textarea
                id="resubmit-note"
                name="note"
                placeholder="Describe what you've done to address this issue..."
                rows="4"
                required
              ></textarea>
              <small class="hint-text" id="resubmit-hint">
                Explain what steps you've taken to resolve the rejection.
              </small>
            </div>

            <!-- Upload progress -->
            <div class="upload-progress" id="upload-progress" hidden>
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <small id="progress-text">Uploading...</small>
            </div>

            <!-- Form actions -->
            <div class="form-actions">
              <button type="button" class="btn btn-outline" id="resubmit-cancel">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary" id="resubmit-submit">
                Submit Resubmission
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/config.js"></script>
    <script src="js/vendor/qrcode.js"></script>
    <script src="js/resubmit.js"></script>
    <script src="js/student.js"></script>
  </body>
</html>
