<!-- Resubmission Modal -->
<div id="resubmit-modal" class="modal" hidden>
  <div class="modal-overlay"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h2>Resubmit Your Clearance Item</h2>
      <button class="modal-close" id="resubmit-close">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Item info section -->
      <div class="resubmit-info">
        <div class="info-row">
          <span class="label">Office:</span>
          <span class="value" id="resubmit-office">—</span>
        </div>
        <div class="info-row">
          <span class="label">Rejection reason:</span>
          <span class="value" id="resubmit-reason">—</span>
        </div>
        <div class="info-row">
          <span class="label">Category:</span>
          <span class="value category-badge" id="resubmit-category">—</span>
        </div>
      </div>

      <!-- Resubmission form -->
      <form id="resubmit-form">
        <!-- Contextual note section -->
        <div class="form-group">
          <label for="resubmit-note">
            <span class="label-icon" id="resubmit-icon">✏️</span>
            <span id="resubmit-label">Tell us how you fixed this</span>
          </label>
          <textarea
            id="resubmit-note"
            name="note"
            placeholder="Describe how you've resolved the issue..."
            rows="4"
            required
          ></textarea>
          <small class="hint-text" id="resubmit-hint">
            Explain what you've done to address the rejection.
          </small>
        </div>

        <!-- File upload section -->
        <div class="form-group">
          <label for="resubmit-files">
            <span class="label-icon">📎</span>
            Upload Documents (Optional)
          </label>
          <div class="file-upload-area" id="file-upload-area">
            <input
              type="file"
              id="resubmit-files"
              name="documents"
              multiple
              accept=".pdf,.jpg,.jpeg,.png"
            >
            <div class="upload-placeholder">
              <div class="upload-icon">📄</div>
              <div class="upload-text">
                <p>Drag files here or click to browse</p>
                <small>PDF, JPG, PNG (up to 5 files, 10MB each)</small>
              </div>
            </div>
          </div>
          <div class="file-list" id="file-list"></div>
        </div>

        <!-- Upload progress -->
        <div class="upload-progress" id="upload-progress" hidden>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <small id="progress-text">Uploading...</small>
        </div>

        <!-- Form actions -->
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="resubmit-cancel">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary" id="resubmit-submit">
            Submit Resubmission
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
